<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Госпи — ТВ</title>


    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-weight='bold' fill='%23ff6b6b'>G</text></svg>" />


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }

        /* ===== АНИМАЦИЯ ПОЯВЛЕНИЯ ===== */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        .tv {
            background: #2a2a2a;
            border-radius: 60px 60px 30px 30px;
            padding: 30px 30px 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 0 3px #444;
            position: relative;

            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0; 
        }


        .antenna {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-size: 28px;
            color: #888;
        }
        .antenna i {
            transform: rotate(-30deg);
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }
        .antenna i:last-child {
            transform: rotate(30deg);
        }


        .screen {
            background: #0a0a0a;
            border-radius: 30px;
            padding: 30px 25px 25px;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9), 0 0 0 2px #555;
            position: relative;
            overflow: hidden;
        }


        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                transparent 0px,
                transparent 3px,
                rgba(255,255,255,0.02) 3px,
                rgba(255,255,255,0.02) 4px
            );
            animation: scan 8s linear infinite;
            z-index: 2;
        }
        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }


        .glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 30px;
            box-shadow: inset 0 0 80px rgba(255,100,100,0.05);
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 3;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 3px solid #ff6b6b;
            box-shadow: 0 0 30px rgba(255,107,107,0.4);
            background: #1a1a1a;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 34px;
            color: #f0f0f0;
            text-align: center;
            text-shadow: 0 0 20px rgba(255,107,107,0.3);
            letter-spacing: 3px;
        }

        .sub {
            text-align: center;
            font-size: 18px;
            color: #ff6b6b;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .sub i {
            margin-right: 8px;
        }

        .desc {
            color: #ccc;
            font-size: 16px;
            line-height: 1.7;
            text-align: center;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 20px;
            border-left: 4px solid #ff6b6b;
            margin-bottom: 28px;
            font-family: 'Segoe UI', sans-serif;
        }

        .social-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .social-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1c1c1c;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            color: #ddd;
            font-weight: 500;
            font-size: 15px;
            border: 1px solid #333;
            transition: 0.25s;
            font-family: 'Segoe UI', sans-serif;
        }
        .social-item i { font-size: 20px; width: 24px; text-align: center; }
        .social-item:hover {
            background: #2a2a2a;
            border-color: #ff6b6b;
            transform: scale(1.04);
        }
        .social-item.youtube i { color: #FF0000; }
        .social-item.twitch i { color: #9146FF; }
        .social-item.discord i { color: #5865F2; }
        .social-item.telegram i { color: #0088cc; }
        .social-item.modrinth i { color: #1bd96a; }
        .social-item.curseforge i { color: #f16436; }

        .btn-primary {
            display: inline-block;
            background: #ff6b6b;
            color: #fff;
            font-weight: 600;
            font-size: 18px;
            padding: 14px 44px;
            border-radius: 60px;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(255,107,107,0.3);
            font-family: 'Segoe UI', sans-serif;
        }
        .btn-primary:hover {
            background: #e85a5a;
            transform: scale(1.04);
        }

        .footer {
            margin-top: 28px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #222;
            padding-top: 20px;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .footer a { color: #ff6b6b; text-decoration: none; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .controls span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #444;
            box-shadow: inset 0 0 5px #222;
        }
        .controls span:nth-child(1) { background: #ff6b6b; }
        .controls span:nth-child(2) { background: #ffb347; }
        .controls span:nth-child(3) { background: #4caf50; }


        @media (max-width: 480px) {
            .tv { padding: 15px; }
            .screen { padding: 20px 15px; }
            h1 { font-size: 26px; }
            .social-item { padding: 8px 14px; font-size: 14px; }
            .btn-primary { padding: 12px 30px; font-size: 16px; }
            .avatar { width: 100px; height: 100px; }
            .antenna { font-size: 20px; top: -25px; gap: 20px; }
        }
    </style>
</head>
<body>

<div class="tv">

    <div class="antenna">
        <i class="fas fa-wifi"></i>
        <i class="fas fa-wifi"></i>
    </div>


    <div class="screen">
        <div class="scanlines"></div>
        <div class="glow"></div>

        <div class="content">
            <div class="avatar">
                <img src="gospi.jpg" alt="Госпи" />
            </div>

            <h1>ГОСПИ</h1>
            <div class="sub"><i class="fas fa-broadcast-tower"></i> ТВ & СТРИМЫ</div>

            <div class="desc">
                <i class="fas fa-quote-left" style="color:#ff6b6b; margin-right:6px;"></i>
                Моды, стримы и немного магии. Добро пожаловать на мой канал!
                <i class="fas fa-quote-right" style="color:#ff6b6b; margin-left:6px;"></i>
            </div>

            <div class="social-grid">
                <a href="https://www.youtube.com/@Госпи" class="social-item youtube" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
                <a href="https://www.twitch.tv/gospi404" class="social-item twitch" target="_blank"><i class="fab fa-twitch"></i> Twitch</a>
                <a href="https://modrinth.com/user/Gospi" class="social-item modrinth" target="_blank"><i class="fas fa-cube"></i> Modrinth</a>
                <a href="https://www.curseforge.com/members/gospi/projects" class="social-item curseforge" target="_blank"><i class="fas fa-dragon"></i> CurseForge</a>
                <a href="https://discord.gg/hpJvampHMs" class="social-item discord" target="_blank"><i class="fab fa-discord"></i> Discord</a>
                <a href="https://t.me/Gooospi" class="social-item telegram" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
            </div>

            <div style="text-align: center;">
                <a href="https://www.youtube.com/@Госпи" class="btn-primary" target="_blank">
                    <i class="fas fa-play" style="margin-right: 10px;"></i> Смотреть
                </a>
            </div>

            <div class="footer">
                📡 Связь: <a href="mailto:gospi_connect@mail.ru">gospi_connect@mail.ru</a>
            </div>
        </div>
    </div>


    <div class="controls">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

</body>
</html>
